apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelo-viewer
  namespace: travelo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: travelo
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: travelo
subjects:
- kind: ServiceAccount
  name: travelo-viewer
  namespace: travelo
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io